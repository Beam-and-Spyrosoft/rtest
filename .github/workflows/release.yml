name: Release
# Builds rtest packages for every supported ROS distro and platform from a
# version tag and attaches them to a GitHub Release:
#   - .conda packages (pixi publish): linux-64, linux-aarch64, osx-arm64, osx-64
#   - .deb packages (bloom-generate + debhelper against the ROS apt repository,
#     on native runners, no Docker): amd64, arm64
#
# Runs when a version tag (e.g. 0.2.5, created by
# `pixi run -e release prepare-release`) is pushed, see RELEASING.md.
# It does not publish to packages.ros.org, that still goes through bloom-release.

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing version tag to release (e.g. 0.2.5)"
        required: true
        type: string
      create_github_release:
        description: "Create the GitHub Release (otherwise only build and test the packages)"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  PIXI_VERSION: v0.81.0
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  version:
    name: Check version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - name: Check tag matches package.xml versions
        id: check
        run: |
          if ! [[ "${TAG}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "❌ '${TAG}' is not a version tag (X.Y.Z)."
            exit 1
          fi
          for manifest in rtest/package.xml examples/package.xml rtest_examples_interfaces/package.xml; do
            version="$(sed -n 's|.*<version>\(.*\)</version>.*|\1|p' "${manifest}" | head -1)"
            if [ "${version}" != "${TAG}" ]; then
              echo "❌ ${manifest} has version ${version}, tag is ${TAG}."
              exit 1
            fi
          done
          echo "✅ All package.xml files are at ${TAG}."
          echo "version=${TAG}" >> "${GITHUB_OUTPUT}"

  conda:
    name: "conda · ${{ matrix.distro }} · ${{ matrix.platform }}"
    needs: version
    strategy:
      fail-fast: false
      matrix:
        distro: [jazzy, kilted, lyrical]
        platform: [linux-64, linux-aarch64, osx-arm64, osx-64]
        include:
          - platform: linux-64
            runner: ubuntu-24.04
          - platform: linux-aarch64
            runner: ubuntu-24.04-arm
          - platform: osx-arm64
            runner: macos-26
          - platform: osx-64
            runner: macos-26-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      DISTRO: ${{ matrix.distro }}
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - name: Set up Pixi
        uses: prefix-dev/setup-pixi@v0.10.2
        with:
          pixi-version: ${{ env.PIXI_VERSION }}
          run-install: false
          cache: false

      # pixi-build-ros takes the ROS distro (and the robostack channel to build
      # against) from the workspace's default environment. Point it at the
      # distro being built. Only this throwaway checkout is modified.
      - name: Select ROS ${{ matrix.distro }} as the default environment
        run: |
          sed -i.bak "s/^default = \[.*\]$/default = [\"${DISTRO}\"]/" pixi.toml
          rm pixi.toml.bak
          grep -qx "default = \[\"${DISTRO}\"\]" pixi.toml

      # The build hash is the same on every platform, so prefix the build string
      # with the platform (dashes are not allowed in it) to keep the file names
      # unique among the release assets, e.g. ros-jazzy-rtest-0.2.5-linux64_h1234abc_0.conda
      - name: Build conda package
        run: pixi publish --path rtest --target-dir dist --build-string-prefix "${PLATFORM//-/}"
        env:
          PLATFORM: ${{ matrix.platform }}

      - name: Check package
        run: |
          ls -la dist
          compgen -G "dist/ros-${DISTRO}-rtest-${VERSION}-*.conda" > /dev/null

      - name: Upload conda package
        uses: actions/upload-artifact@v7
        with:
          name: conda-${{ matrix.distro }}-${{ matrix.platform }}
          path: dist/*.conda
          if-no-files-found: error

  deb:
    name: "deb · ${{ matrix.distro }} · ${{ matrix.arch }}"
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          # jazzy and kilted target Ubuntu 24.04 (noble), lyrical Ubuntu 26.04 (resolute)
          - { distro: jazzy, arch: amd64, runner: ubuntu-24.04 }
          - { distro: jazzy, arch: arm64, runner: ubuntu-24.04-arm }
          - { distro: kilted, arch: amd64, runner: ubuntu-24.04 }
          - { distro: kilted, arch: arm64, runner: ubuntu-24.04-arm }
          - { distro: lyrical, arch: amd64, runner: ubuntu-26.04 }
          - { distro: lyrical, arch: arm64, runner: ubuntu-26.04-arm }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      DISTRO: ${{ matrix.distro }}
      VERSION: ${{ needs.version.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - name: Add ROS apt repository and packaging tools
        run: |
          bash scripts/release/setup-ros-apt.sh
          sudo apt-get install -y debhelper dpkg-dev fakeroot

      # bloom and rosdep come from the pixi `release` environment.
      - name: Set up Pixi
        uses: prefix-dev/setup-pixi@v0.10.2
        with:
          pixi-version: ${{ env.PIXI_VERSION }}
          environments: release
          locked: true
          cache: false

      - name: Install build dependencies with rosdep
        run: |
          pixi run -e release rosdep-setup
          pixi run -e release rosdep install --from-paths rtest --ignore-src --rosdistro "${DISTRO}" -y

      - name: Generate Debian packaging with bloom
        run: pixi run -e release bash -c 'cd rtest && bloom-generate rosdebian --ros-distro "${DISTRO}"'

      # Must run outside any pixi environment: the package has to be compiled
      # against /opt/ros and the system toolchain, not the conda libraries.
      - name: Build .deb package
        shell: bash
        run: |
          source "/opt/ros/${DISTRO}/setup.bash"
          cd rtest
          fakeroot debian/rules binary

      - name: Check package
        shell: bash
        run: |
          mkdir -p dist
          mv ros-${DISTRO}-rtest_*.deb dist/
          deb="$(ls dist/ros-${DISTRO}-rtest_*.deb)"
          dpkg-deb --info "${deb}"
          arch="$(dpkg-deb --field "${deb}" Architecture)"
          version="$(dpkg-deb --field "${deb}" Version)"
          if [ "${arch}" != "${{ matrix.arch }}" ]; then
            echo "❌ ${deb} is built for ${arch}, expected ${{ matrix.arch }}."
            exit 1
          fi
          if [[ "${version}" != "${VERSION}"-* ]]; then
            echo "❌ ${deb} has version ${version}, expected ${VERSION}-*."
            exit 1
          fi
          echo "✅ ${deb}: ${arch}, ${version}"

      - name: Upload .deb package
        uses: actions/upload-artifact@v7
        with:
          name: deb-${{ matrix.distro }}-${{ matrix.arch }}
          path: dist/*.deb
          if-no-files-found: error

  # Install the .deb on a clean runner, the way a user would, and build and
  # test the examples against it.
  deb-smoke-test:
    name: "deb smoke test · ${{ matrix.distro }} · ${{ matrix.arch }}"
    needs: deb
    strategy:
      fail-fast: false
      matrix:
        include:
          - { distro: jazzy, arch: amd64, runner: ubuntu-24.04 }
          - { distro: jazzy, arch: arm64, runner: ubuntu-24.04-arm }
          - { distro: kilted, arch: amd64, runner: ubuntu-24.04 }
          - { distro: kilted, arch: arm64, runner: ubuntu-24.04-arm }
          - { distro: lyrical, arch: amd64, runner: ubuntu-26.04 }
          - { distro: lyrical, arch: arm64, runner: ubuntu-26.04-arm }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      DISTRO: ${{ matrix.distro }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - name: Download .deb package
        uses: actions/download-artifact@v8
        with:
          name: deb-${{ matrix.distro }}-${{ matrix.arch }}
          path: dist

      - name: Install rtest from the .deb package
        run: |
          bash scripts/release/setup-ros-apt.sh
          # build-essential: ROS packages don't pull in a C++ compiler, and the
          # test should not depend on what the runner image happens to ship.
          sudo apt-get install -y ./dist/ros-${DISTRO}-rtest_*.deb build-essential \
            python3-colcon-common-extensions python3-rosdep
          sudo rosdep init
          rosdep update
          # rtest itself is already installed from the .deb above.
          rosdep install --from-paths examples rtest_examples_interfaces --ignore-src \
            --rosdistro "${DISTRO}" --skip-keys rtest -y

      - name: Build and test the examples against the installed rtest
        shell: bash
        run: |
          source "/opt/ros/${DISTRO}/setup.bash"
          colcon build --base-paths examples rtest_examples_interfaces \
            --cmake-args -DRTEST_BUILD_EXAMPLES=ON -DBUILD_TESTING=ON
          source install/setup.bash
          colcon test --base-paths examples rtest_examples_interfaces --event-handlers console_cohesion+
          colcon test-result --verbose

  release:
    name: GitHub Release
    needs: [version, conda, deb-smoke-test]
    if: github.event_name == 'push' || inputs.create_github_release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download conda packages
        uses: actions/download-artifact@v8
        with:
          pattern: conda-*
          path: dist
          merge-multiple: true

      - name: Download .deb packages
        uses: actions/download-artifact@v8
        with:
          pattern: deb-*
          path: dist
          merge-multiple: true

      - name: List release files
        run: ls -la dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.TAG }}
          name: rtest ${{ env.TAG }}
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true
