name: Static Code Analysis with clang-tidy

on:
  schedule:
    - cron: "0 0 * * *" # Nightly at midnight UTC
  workflow_dispatch: # On-demand trigger

jobs:
  clang-tidy:
    name: "clang-tidy (${{ matrix.environment }})"
    strategy:
      fail-fast: false
      matrix:
        environment: [jazzy, kilted, lyrical]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Pixi
        uses: prefix-dev/setup-pixi@v0.10.1
        with:
          pixi-version: v0.77.0
          environments: ${{ matrix.environment }}
          cache: true

      - name: Run clang-tidy analysis
        run: pixi run -e ${{ matrix.environment }} clang-tidy

      - name: Upload clang-tidy report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: clang-tidy-report-${{ matrix.environment }}
          path: build/${{ matrix.environment }}-clang/clang-tidy-report.xml
          if-no-files-found: warn
