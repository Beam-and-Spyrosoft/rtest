name: Pixi Build

on:
  workflow_dispatch: # On-demand trigger
  pull_request:
    branches:
      - main
      - jazzy
      - kilted
      - lyrical
  push:
    branches:
      - main
      - jazzy
      - kilted
      - lyrical

jobs:
  pixi-build:
    name: "Pixi - ROS 2 ${{ matrix.environment }}; compiler: ${{ matrix.compiler }}"
    strategy:
      fail-fast: false
      matrix:
        environment: [jazzy, kilted]
        arch: [amd64, arm64]
        compiler: [gnu, clang]
    runs-on: ubuntu-latest
    continue-on-error: true # Pixi builds are experimental
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_BASEDIR: ${{ github.workspace }} 

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Cache ccache
        uses: actions/cache@v5
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ runner.os }}-${{ matrix.environment }}-${{ matrix.compiler }}-${{ matrix.arch }}-${{ github.head_ref }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ matrix.environment }}-${{ matrix.compiler }}-${{ matrix.arch }}-main

      - name: Set up Pixi
        uses: prefix-dev/setup-pixi@v0.9.4
        with:
          pixi-version: v0.68.1
          environments: ${{ matrix.environment }}
          cache: true

      - name: Build and Test
        run: pixi run -e ${{ matrix.environment }} test ${{ matrix.compiler }}