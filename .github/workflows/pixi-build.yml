name: Pixi Build

on:
  workflow_dispatch: # On-demand trigger
  pull_request:
    branches:
      - main
      - jazzy
      - kilted
      - lyrical
  push:
    branches:
      - main
      - jazzy
      - kilted
      - lyrical

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pixi-build:
    name: "Pixi - ROS 2 ${{ matrix.environment }}; ${{ matrix.compiler }}; ${{ matrix.arch }}"
    strategy:
      fail-fast: false
      matrix:
        environment: [jazzy, kilted, lyrical]
        arch: [amd64, arm64]
        compiler: [gnu, clang]
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Cache ccache
        uses: actions/cache@v5
        with:
          path: ${{ env.CCACHE_DIR }}
          # run_id makes the key unique so each run can save (caches are immutable).
          # Restore prefers this branch, then any matching matrix cell.
          key: ccache-${{ runner.os }}-${{ matrix.environment }}-${{ matrix.compiler }}-${{ matrix.arch }}-${{ github.head_ref || github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ matrix.environment }}-${{ matrix.compiler }}-${{ matrix.arch }}-${{ github.head_ref || github.ref_name }}-
            ccache-${{ runner.os }}-${{ matrix.environment }}-${{ matrix.compiler }}-${{ matrix.arch }}-

      - name: Set up Pixi
        uses: prefix-dev/setup-pixi@v0.10.1
        with:
          pixi-version: v0.77.0
          environments: ${{ matrix.environment }}
          cache: true

      - name: Build and Test
        run: pixi run -e ${{ matrix.environment }} test ${{ matrix.compiler }}
